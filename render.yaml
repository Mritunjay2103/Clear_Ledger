# Render blueprint. Creates the service, the health check and the environment in
# one step.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# You are prompted for DEMO_USERNAME and DEMO_PASSWORD during creation; they are
# never stored in this file.
#
# Configured for the FREE plan, which has no persistent storage. See the note on
# `plan` below for what that costs and how to reverse it.

services:
  - type: web
    name: clearledger
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free: 0.1 CPU / 512 MB, and NO persistent disk — Render does not allow one
    # on this plan. The filesystem is wiped on every restart, redeploy and
    # spin-down, so processed runs and uploaded PDFs do not survive. Reference
    # data does: it is re-seeded from the CSVs in the image on every boot.
    #
    # To keep history, move to `0.5c-512mb` and restore the `disk:` block below.
    plan: free
    region: singapore # oregon | ohio | virginia | frankfurt | singapore
    branch: main
    healthCheckPath: /api/readiness

    # SQLite has exactly one writer. A second instance would corrupt the ledger,
    # so this is a correctness constraint rather than a cost decision.
    numInstances: 1

    # Persistence, on a paid plan. Uncomment together with the plan change above;
    # mountPath must match DATA_DIR.
    # disk:
    #   name: clearledger-data
    #   mountPath: /data
    #   sizeGB: 1

    envVars:
      - key: APP_ENV
        value: production # Refuses to start without reviewer credentials.
      - key: DATA_DIR
        value: /data
      - key: EXTRACTION_PROVIDER
        value: rules # Deterministic parser: no key, no model download.
      - key: DEMO_USERNAME
        sync: false # Prompted for in the dashboard.
      - key: DEMO_PASSWORD
        sync: false # At least 12 characters. There is no default.
